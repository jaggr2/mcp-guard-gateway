name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-gateway:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jaggr2/mcp-guard-gateway:latest
            ghcr.io/jaggr2/mcp-guard-gateway:${{ github.sha }}

  build-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bridge image
        uses: docker/build-push-action@v6
        with:
          context: bridge
          push: true
          tags: |
            ghcr.io/jaggr2/mcp-guard-gateway-bridge:latest
            ghcr.io/jaggr2/mcp-guard-gateway-bridge:${{ github.sha }}

  build-unifi-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unifi bridge image
        uses: docker/build-push-action@v6
        with:
          context: bridge
          file: bridge/Dockerfile.unifi
          push: true
          tags: |
            ghcr.io/jaggr2/mcp-guard-gateway-unifi-bridge:latest
            ghcr.io/jaggr2/mcp-guard-gateway-unifi-bridge:${{ github.sha }}
