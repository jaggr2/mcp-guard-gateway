name: publish-browser

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push browser image
        uses: docker/build-push-action@v6
        with:
          context: browser
          push: true
          tags: |
            ghcr.io/jaggr2/mcp-guard-gateway-browser:latest
            ghcr.io/jaggr2/mcp-guard-gateway-browser:${{ github.sha }}
